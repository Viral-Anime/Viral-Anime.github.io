<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Viral Anime Hub | Naruto, Solo Leveling, Haikyuu Home - Watch Latest Anime Free</title>
    <meta name="description" content="Watch latest anime like Naruto, Haikyuu and more for free on Viral Anime Hub.">
    <meta property="og:title" content="Viral Anime Hub 🔥">
    <meta property="og:image" content="https://image.tmdb.org/t/p/w500/29931.jpg">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff0055">

<script src="https://eminentpercentvandalism.com/be/9a/44/be9a440f6303da5aa4bc96a3f3ad06a4.js"></script>

    
    <style>
        :root { --main: #ff0055; --bg: #0b0e14; --card: #1c2129; --text: #fff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        
        header { padding: 15px 5%; background: #000; border-bottom: 2px solid var(--main); display: flex; justify-content: space-between; align-items: center; position: sticky; top:0; z-index:100; }
        .logo { font-size: 20px; font-weight: bold; color: var(--main); text-transform: uppercase; text-decoration: none; }
        
        .header-right { display: flex; gap: 10px; align-items: center; }
        .search-box { padding: 8px 15px; border-radius: 20px; border: 1px solid #444; background: #222; color: #fff; width: 140px; outline: none; transition: 0.3s; }
        .search-box:focus { width: 180px; border-color: var(--main); }
        
        .share-btn { background: var(--main); color: white; border: none; border-radius: 50%; width: 35px; height: 35px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: 0.3s; }
        .share-btn:active { transform: scale(0.9); }

        .container { padding: 20px 5%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        
        .card { background: var(--card); border-radius: 10px; overflow: hidden; text-decoration: none; color: inherit; border: 1px solid #333; transition: 0.3s; position: relative; display: block; }
        .card:hover { transform: translateY(-5px); border-color: var(--main); box-shadow: 0 5px 15px rgba(255, 0, 85, 0.2); }
        .card img { width: 100%; height: 230px; object-fit: cover; display: block; }
        
        .card-info { padding: 10px; text-align: center; }
        .card h3 { font-size: 13px; margin: 0; height: 35px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .card-year { margin-top: 5px; font-size: 12px; color: var(--main); font-weight: bold; }

        .views-badge { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7); color: #fff; padding: 2px 7px; border-radius: 5px; font-size: 10px; z-index: 1; }

        @media (max-width: 600px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">Viral Anime</a>
        <div class="header-right">
            <input type="text" class="search-box" placeholder="Search..." id="search" onkeyup="search()">
            <button class="share-btn" onclick="shareSite()" title="Share Website">
                <i class="fa-solid fa-share-nodes"></i> 🔗
            </button>
        </div>
    </header>

    <div class="container">
        <h2 style="font-size: 18px; border-left: 3px solid var(--main); padding-left: 10px; margin-bottom: 20px;">LATEST UPDATES</h2>
        <div class="grid" id="animeGrid"></div>
    </div>

    <footer style="margin-top: 40px; padding: 20px 0; text-align: center; border-top: 1px solid #333; background: #000; color: #8b949e; font-size: 14px;">
        <p style="margin: 0;">&copy; 2024 - 2026 <span style="color: #ff0055; font-weight: bold;">Viral Anime</span>. All Rights Reserved.</p>
    </footer>

    <script src="js/main_data.js"></script>
    <script src="js/list.js"></script>

    <script>
        // --- 1. Load Anime Files ---
        if (typeof myAnimes !== 'undefined' && myAnimes.length > 0) {
            myAnimes.forEach(name => {
                let s = document.createElement('script');
                s.src = `js/animes/${name}.js`;
                s.async = false; 
                document.head.appendChild(s);
            });
        }

        // --- 2. Render Cards ---
        function render(list) {
            const grid = document.getElementById('animeGrid');
            if (!list || list.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; padding:50px; opacity:0.5;">No results found...</p>`;
                return;
            }

            grid.innerHTML = list.map(a => {
                const v = Math.floor(Math.random() * (5000 - 1000 + 1)) + 1000;
                return `
                <a href="details.html?id=${a.id}" class="card">
                    <div class="views-badge">👁️ ${v}</div>
                    <img src="${a.poster}" alt="${a.title}" loading="lazy">
                    <div class="card-info">
                        <h3>${a.title}</h3>
                        <div class="card-year">${a.year || '2024'}</div>
                    </div>
                </a>
                `;
            }).join('');
        }

        // --- 3. Search logic ---
        function search() {
            const query = document.getElementById('search').value.toLowerCase();
            const filtered = animeList.filter(item => 
                item.title.toLowerCase().includes(query)
            );
            render(filtered);
        }

        // --- 4. Updated Share Site Logic ---
        function shareSite() {
            const shareTitle = "🔥 Viral Anime Hub";
            const shareText = "🔥 Watch 5K+ FREE episodes in Hindi Dubbed!\nCheck it out here:";
            const shareUrl = "https://viral-anime.github.io"; // Apni actual URL check kar lena

            if (navigator.share) {
                // Mobile native share (WhatsApp, Instagram, etc.)
                navigator.share({
                    title: shareTitle,
                    text: shareText,
                    url: shareUrl
                }).catch(console.error);
            } else {
                // PC/Desktop ke liye WhatsApp Web redirect
                const fullText = shareText + "\n" + shareUrl;
                window.open("https://wa.me/?text=" + encodeURIComponent(fullText), "_blank");
            }
        }

        // --- 5. SMART LOADER ---
        let checkCount = 0;
        const totalExpected = (typeof myAnimes !== 'undefined') ? myAnimes.length : 0;

        const checkData = setInterval(() => {
            checkCount++;
            if (typeof animeList !== 'undefined' && animeList.length >= totalExpected && totalExpected > 0) {
                render(animeList);
                clearInterval(checkData); 
            } 
            else if (checkCount > 50) { 
                if (typeof animeList !== 'undefined' && animeList.length > 0) {
                    render(animeList);
                } else {
                    document.getElementById('animeGrid').innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:yellow;">Loading... Refresh the page.</p>`;
                }
                clearInterval(checkData);
            }
        }, 100); 
    </script>

      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-MJBWSZNBEM); // Yahan apni asli ID replace karna
    </script>

</body>
</html>
