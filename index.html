    <style>
        :root { --main: #ff0055; --bg: #0b0e14; --card: #1c2129; --text: #fff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; }

        /* 2-Line Header Setup */
        header { background: #000; border-bottom: 2px solid var(--main); position: sticky; top:0; z-index:99999; padding: 10px 5%; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .logo { font-size: 20px; font-weight: bold; color: var(--main); text-transform: uppercase; text-decoration: none; }
        
        .share-btn { background: var(--main); color: white; border: none; border-radius: 8px; padding: 6px 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 13px; transition: 0.3s; }
        
        .search-container { width: 100%; }
        .search-box { width: 100%; padding: 10px 15px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; outline: none; box-sizing: border-box; }
        .search-box:focus { border-color: var(--main); }

        .container { padding: 15px 3%; }
        
        /* 4 Cards Grid Layout (Mobile) */
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

        .card { background: var(--card); border-radius: 6px; overflow: hidden; text-decoration: none; color: inherit; border: 1px solid #333; transition: 0.3s; position: relative; display: block; }
        .card img { width: 100%; height: 130px; object-fit: cover; display: block; }

        .card-info { padding: 6px; text-align: center; }
        .card h3 { font-size: 9px; margin: 0; height: 24px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.2; }
        .card-year { margin-top: 3px; font-size: 9px; color: var(--main); font-weight: bold; }

        .views-badge { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.8); color: #fff; padding: 2px 5px; border-radius: 3px; font-size: 8px; z-index: 1; }

        /* Stylish Pagination */
        .pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 30px; padding-bottom: 20px; }
        .page-btn { padding: 8px 14px; background: #1c2129; border: 1px solid #444; color: white; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; transition: 0.3s; }
        .page-btn:active { background: var(--main); }
        .page-btn:disabled { opacity: 0.2; cursor: not-allowed; }
        .page-num { padding: 8px 14px; border-radius: 6px; background: var(--main); color: white; font-weight: bold; font-size: 13px; }

        @media (min-width: 768px) {
            .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
            .card img { height: 230px; }
            .card h3 { font-size: 13px; height: 35px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <a href="index.html" class="logo">Viral Anime</a>
            <button class="share-btn" onclick="shareSite()">
                <i class="fa-solid fa-paper-plane"></i> SHARE
            </button>
        </div>
        <div class="search-container">
            <input type="text" class="search-box" placeholder="Search..." id="search" onkeyup="search()">
        </div>
    </header>

    <div class="container">
        <h2 style="font-size: 16px; border-left: 3px solid var(--main); padding-left: 10px; margin-bottom: 20px;">LATEST UPDATES</h2>
        <div class="grid" id="animeGrid"></div>

        <div class="pagination" id="paginationBox">
            <button class="page-btn" id="prevPage" onclick="changePage(-1)"><i class="fas fa-chevron-left"></i></button>
            <div id="pageNumbers" style="display: flex; gap: 5px;"></div>
            <button class="page-btn" id="nextPage" onclick="changePage(1)"><i class="fas fa-chevron-right"></i></button>
        </div>
    </div>

    <footer style="margin-top: 40px; padding: 20px 0; text-align: center; border-top: 1px solid #333; background: #000; color: #8b949e; font-size: 14px;">
        <p style="margin: 0;">&copy; 2024 - 2026 <span style="color: #ff0055; font-weight: bold;">Viral Anime</span>. All Rights Reserved.</p>
    </footer>

    <script src="js/main_data.js"></script>
    <script src="js/list.js"></script>

    <script>
        let currentPage = 1;
        const itemsPerPage = 20;
        let currentList = [];

        if (typeof myAnimes !== 'undefined' && myAnimes.length > 0) {
            myAnimes.forEach(name => {
                let s = document.createElement('script');
                s.src = `js/animes/${name}.js`;
                s.async = false; 
                document.head.appendChild(s);
            });
        }

        function render() {
            const grid = document.getElementById('animeGrid');
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const paginatedItems = currentList.slice(start, end);

            if (paginatedItems.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; padding:50px; opacity:0.5;">No results found...</p>`;
                return;
            }

            grid.innerHTML = paginatedItems.map(a => {
                const v = Math.floor(Math.random() * (5000 - 1000 + 1)) + 1000;
                return `
                <a href="details.html?id=${a.id}" class="card">
                    <div class="views-badge">👁️ ${v}</div>
                    <img src="${a.poster}" alt="${a.title}" loading="lazy">
                    <div class="card-info">
                        <h3>${a.title}</h3>
                        <div class="card-year">${a.year || '2024'}</div>
                    </div>
                </a>
                `;
            }).join('');

            updatePagination();
        }

        function updatePagination() {
            const totalPages = Math.ceil(currentList.length / itemsPerPage);
            const pageNumbers = document.getElementById('pageNumbers');
            pageNumbers.innerHTML = `<span class="page-num">${currentPage}</span>`; // Active page display

            document.getElementById('prevPage').disabled = (currentPage === 1);
            document.getElementById('nextPage').disabled = (currentPage >= totalPages);
            document.getElementById('paginationBox').style.display = (currentList.length <= itemsPerPage) ? 'none' : 'flex';
        }

        function changePage(step) {
            currentPage += step;
            window.scrollTo({top: 0, behavior: 'smooth'});
            render();
        }

        function search() {
            const query = document.getElementById('search').value.toLowerCase();
            currentList = animeList.filter(item => item.title.toLowerCase().includes(query));
            currentPage = 1;
            render();
        }

        function shareSite() {
            const shareUrl = "https://viral-anime.github.io";
            if (navigator.share) {
                navigator.share({ title: "Viral Anime Hub", text: "Watch Anime Free!", url: shareUrl });
            } else {
                window.open("https://wa.me/?text=" + encodeURIComponent("Watch Anime Free: " + shareUrl));
            }
        }

        // Original Smart Loader Logic
        let checkCount = 0;
        const totalExpected = (typeof myAnimes !== 'undefined') ? myAnimes.length : 0;
        const checkData = setInterval(() => {
            checkCount++;
            if (typeof animeList !== 'undefined' && animeList.length >= totalExpected && totalExpected > 0) {
                currentList = animeList;
                render();
                clearInterval(checkData); 
            } 
            else if (checkCount > 50) { 
                if (typeof animeList !== 'undefined' && animeList.length > 0) {
                    currentList = animeList;
                    render();
                }
                clearInterval(checkData);
            }
        }, 100); 
    </script>

</body>
