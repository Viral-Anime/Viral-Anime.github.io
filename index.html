    <style>
        :root { --main: #ff0055; --bg: #0b0e14; --card: #1c2129; --text: #fff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; }

        /* Stylish Header */
        header { background: #000; border-bottom: 2px solid var(--main); position: sticky; top:0; z-index:99999; padding: 15px 5%; }
        
        .header-top { display: grid; grid-template-columns: 50px 1fr 50px; align-items: center; margin-bottom: 10px; }
        
        /* Logo with Pink-to-White Vertical Gradient */
        .logo { 
            font-size: 42px; 
            line-height: 0.9; 
            font-weight: 900; 
            text-transform: uppercase; 
            text-decoration: none; 
            text-align: center; 
            letter-spacing: 1px;
            display: block;
            /* Yahan Gradient lagaya hai */
            background: linear-gradient(to bottom, #ffffff 10%, #ff0055 90%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .share-btn { background: var(--main); color: white; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: 0.3s; justify-self: end; }
        
        /* Search Container Shifted down for more gap */
        .search-container { width: 100%; padding: 0 2px; margin-top: 30px; }
        .search-box { 
            width: 100%; 
            padding: 14px 22px; 
            border-radius: 30px; 
            border: 1px solid #333; 
            background: #1a1e24; 
            color: #fff; 
            outline: none; 
            box-sizing: border-box; 
            font-size: 15px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
            transition: 0.3s;
        }
        .search-box:focus { border-color: var(--main); background: #222; }

        .container { padding: 20px 3%; }
        
        /* 3 Cards Grid Layout (Mobile) */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

        .card { background: var(--card); border-radius: 8px; overflow: hidden; text-decoration: none; color: inherit; border: 1px solid #333; transition: 0.3s; position: relative; display: block; }
        .card img { width: 100%; height: 160px; object-fit: cover; display: block; }

        .card-info { padding: 8px; text-align: center; }
        .card h3 { font-size: 11px; margin: 0; height: 30px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3; color: #fff; }
        .card-year { margin-top: 4px; font-size: 10px; color: var(--main); font-weight: bold; }

        .views-badge { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.8); color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 9px; z-index: 1; border: 1px solid rgba(255,255,255,0.1); }

        /* Pagination Styles */
        .pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 30px; padding-bottom: 20px; }
        .page-btn { padding: 10px 16px; background: #1c2129; border: 1px solid #444; color: white; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; transition: 0.3s; }
        .page-btn:active { background: var(--main); transform: scale(0.95); }
        .page-btn:disabled { opacity: 0.2; cursor: not-allowed; }
        .page-num { padding: 10px 16px; border-radius: 8px; background: var(--main); color: white; font-weight: bold; font-size: 14px; box-shadow: 0 4px 10px rgba(255, 0, 85, 0.3); }

        @media (min-width: 768px) {
            .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
            .card img { height: 230px; }
            .card h3 { font-size: 13px; height: 35px; }
            .logo { font-size: 50px; }
        }

<body>

    <header>
        <div class="header-top">
            <div style="width:38px;"></div> <a href="index.html" class="logo">Viral<br>Anime</a>
            <button class="share-btn" onclick="shareSite()" title="Share">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
        <div class="search-container">
            <input type="text" class="search-box" placeholder="Search your favorite anime..." id="search" onkeyup="search()">
        </div>
    </header>

    <div class="container">
        <h2 style="font-size: 16px; border-left: 3px solid var(--main); padding-left: 10px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px;">Latest Updates</h2>
        <div class="grid" id="animeGrid"></div>

        <div class="pagination" id="paginationBox">
            <button class="page-btn" id="prevPage" onclick="changePage(-1)"><i class="fas fa-chevron-left"></i></button>
            <div id="pageNumbers" style="display: flex; gap: 5px;"></div>
            <button class="page-btn" id="nextPage" onclick="changePage(1)"><i class="fas fa-chevron-right"></i></button>
        </div>
    </div>

    <footer style="margin-top: 40px; padding: 25px 0; text-align: center; border-top: 1px solid #333; background: #000; color: #8b949e; font-size: 14px;">
        <p style="margin: 0;">&copy; 2024 - 2026 <span style="color: #ff0055; font-weight: bold;">Viral Anime</span>. All Rights Reserved.</p>
    </footer>

    <script src="js/main_data.js"></script>
    <script src="js/list.js"></script>

    <script>
        let currentPage = 1;
        const itemsPerPage = 20;
        let currentList = [];

        if (typeof myAnimes !== 'undefined' && myAnimes.length > 0) {
            myAnimes.forEach(name => {
                let s = document.createElement('script');
                s.src = `js/animes/${name}.js`;
                s.async = false; 
                document.head.appendChild(s);
            });
        }

        function render() {
            const grid = document.getElementById('animeGrid');
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const paginatedItems = currentList.slice(start, end);

            if (paginatedItems.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; padding:50px; opacity:0.5;">No results found...</p>`;
                return;
            }

            grid.innerHTML = paginatedItems.map(a => {
                const v = Math.floor(Math.random() * (5000 - 1000 + 1)) + 1000;
                return `
                <a href="details.html?id=${a.id}" class="card">
                    <div class="views-badge">👁️ ${v}</div>
                    <img src="${a.poster}" alt="${a.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/150x230?text=No+Image'">
                    <div class="card-info">
                        <h3>${a.title}</h3>
                        <div class="card-year">${a.year || '2024'}</div>
                    </div>
                </a>
                `;
            }).join('');

            updatePagination();
        }

        function updatePagination() {
            const totalPages = Math.ceil(currentList.length / itemsPerPage);
            const pageNumbers = document.getElementById('pageNumbers');
            pageNumbers.innerHTML = `<span class="page-num">${currentPage}</span>`;

            document.getElementById('prevPage').disabled = (currentPage === 1);
            document.getElementById('nextPage').disabled = (currentPage >= totalPages);
            document.getElementById('paginationBox').style.display = (currentList.length <= itemsPerPage) ? 'none' : 'flex';
        }

        function changePage(step) {
            currentPage += step;
            window.scrollTo({top: 0, behavior: 'smooth'});
            render();
        }

        function search() {
            const query = document.getElementById('search').value.toLowerCase();
            currentList = animeList.filter(item => item.title.toLowerCase().includes(query));
            currentPage = 1;
            render();
        }

        function shareSite() {
            const shareUrl = "https://viral-anime.github.io";
            if (navigator.share) {
                navigator.share({ title: "Viral Anime Hub", text: "Watch Anime Free!", url: shareUrl });
            } else {
                window.open("https://wa.me/?text=" + encodeURIComponent("Watch Anime Free: " + shareUrl));
            }
        }

        let checkCount = 0;
        const totalExpected = (typeof myAnimes !== 'undefined') ? myAnimes.length : 0;
        const checkData = setInterval(() => {
            checkCount++;
            if (typeof animeList !== 'undefined' && animeList.length >= totalExpected && totalExpected > 0) {
                currentList = animeList;
                render();
                clearInterval(checkData); 
            } 
            else if (checkCount > 50) { 
                if (typeof animeList !== 'undefined' && animeList.length > 0) {
                    currentList = animeList;
                    render();
                }
                clearInterval(checkData);
            }
        }, 100); 
    </script>
