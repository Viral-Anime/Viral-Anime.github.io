<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Anime Details | Viral Anime Hub</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff0055">
    
    <style>
        :root { --main: #ff0055; --bg: #0b0e14; --card: #1c2129; --accent: #00d4ff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; scroll-behavior: smooth; } /* Smooth scroll enable kiya */
        
        header { padding: 15px 5%; background: #000; border-bottom: 2px solid var(--main); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-weight: bold; color: var(--main); font-size: 18px; text-decoration: none; }
        .back-btn { background: var(--main); color: white; border: none; border-radius: 50%; width: 35px; height: 35px; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: bold; }
        
        .container { padding: 20px 5%; max-width: 900px; margin: auto; }
        
        /* Hero Card */
        .hero-card { background: var(--card); border-radius: 20px; padding: 25px; border: 1px solid #333; text-align: center; margin-bottom: 30px; }
        .hero-card img { width: 160px; height: 230px; border-radius: 12px; margin-bottom: 15px; object-fit: cover; border: 2px solid #444; }
        .hero-card h1 { font-size: 26px; color: var(--main); margin-bottom: 10px; }
        
        .meta-info { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .badge { background: rgba(255,0,85,0.15); border: 1px solid var(--main); padding: 4px 12px; border-radius: 15px; font-size: 12px; color: var(--main); }
        .desc { font-size: 14px; line-height: 1.6; color: #ccc; background: #161b22; padding: 15px; border-radius: 10px; text-align: left; border-left: 3px solid var(--main); margin-top: 15px; }

        /* 🔥 STICKY SEASON NAVIGATION */
        .season-nav { display: flex; gap: 10px; overflow-x: auto; padding: 15px 0; margin-bottom: 20px; position: sticky; top: 68px; background: var(--bg); z-index: 90; border-bottom: 1px solid #222; scrollbar-width: none; }
        .season-nav::-webkit-scrollbar { display: none; } /* Hide scrollbar for Chrome/Safari */
        .nav-btn { background: #222; border: 1px solid #444; color: white; padding: 8px 18px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-size: 13px; font-weight: bold; transition: 0.3s; }
        .nav-btn:hover { border-color: var(--main); color: var(--main); }

        /* Season Sections */
        .season-section { margin-top: 20px; padding-top: 80px; margin-top: -60px; } /* Anchor offset fixing */
        .season-title { font-size: 20px; color: #fff; margin-bottom: 15px; padding-left: 12px; border-left: 4px solid var(--main); text-transform: uppercase; }
        
        .ep-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 50px; }
        .ep-card { background: #161b22; padding: 15px 20px; border-radius: 10px; text-decoration: none; color: white; display: flex; justify-content: space-between; align-items: center; border: 1px solid #222; transition: 0.2s; }
        .ep-card:hover { border-color: var(--main); background: #1c2129; }
        .play-tag { background: var(--main); font-size: 11px; padding: 3px 8px; border-radius: 4px; font-weight: bold; }

        footer { margin-top: 50px; padding: 30px; text-align: center; border-top: 1px solid #333; font-size: 13px; color: #888; }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="back-btn">←</a>
    <a href="index.html" class="logo">VIRAL ANIME</a>
    <div style="width: 35px;"></div>
</header>

<div class="container" id="loader">
    <h2 style="text-align: center; margin-top: 50px; opacity: 0.6;">Loading Seasons... ⏳</h2>
</div>

<div class="container" id="mainContent" style="display: none;">
    <div class="hero-card">
        <img id="poster" src="" alt="Poster">
        <h1 id="title">Anime Title</h1>
        <div class="meta-info" id="meta"></div>
        <p class="desc" id="desc"></p>
    </div>

    <div class="season-nav" id="seasonNav"></div>

    <div id="seasonsContainer"></div>
</div>

<footer>
    <p>&copy; 2024 - 2026 <span style="color:var(--main)">Viral Anime Hub</span></p>
</footer>

<script src="js/main_data.js"></script>
<script src="js/list.js"></script>

<script>
    // 1. Scripts Loading
    if (typeof myAnimes !== 'undefined' && myAnimes.length > 0) {
        myAnimes.forEach(name => {
            let s = document.createElement('script');
            s.src = `js/animes/${name}.js`;
            s.async = false; 
            document.head.appendChild(s);
        });
    }

    // 🔥 SCROLL TO SEASON FUNCTION
    function scrollToSeason(id) {
        const element = document.getElementById(id);
        const headerOffset = 130; // Header + Nav ki height adjust karne ke liye
        const elementPosition = element.getBoundingClientRect().top;
        const offsetPosition = elementPosition + window.pageYOffset - headerOffset;

        window.scrollTo({
            top: offsetPosition,
            behavior: "smooth"
        });
    }

    function setupPage() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const anime = animeList.find(a => a.id === id);

        if (anime) {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';

            document.getElementById('title').innerText = anime.title;
            document.getElementById('poster').src = anime.poster;
            document.getElementById('desc').innerText = anime.description || "No description available.";
            document.getElementById('meta').innerHTML = `<span class="badge">${anime.year || '2024'}</span><span class="badge">⭐ ${anime.rating || 'N/A'}</span>`;

            const nav = document.getElementById('seasonNav');
            const container = document.getElementById('seasonsContainer');
            
            nav.innerHTML = "";
            container.innerHTML = "";

            if (anime.seasons && anime.seasons.length > 0) {
                anime.seasons.forEach((season, sIdx) => {
                    const sectionId = `season-section-${sIdx}`;
                    
                    // Create Nav Button
                    nav.innerHTML += `<button class="nav-btn" onclick="scrollToSeason('${sectionId}')">${season.name}</button>`;

                    // Create Season Section
                    const seasonHtml = `
                        <div class="season-section" id="${sectionId}">
                            <h3 class="season-title">${season.name}</h3>
                            <div class="ep-list">
                                ${season.server1.map((url, eIdx) => `
                                    <a href="player.html?id=${id}&s=${sIdx}&ep=${eIdx}" class="ep-card">
                                        <span><strong>Episode ${eIdx + 1}</strong></span>
                                        <span class="play-tag">PLAY</span>
                                    </a>
                                `).join('')}
                            </div>
                        </div>
                    `;
                    container.innerHTML += seasonHtml;
                });
            }
        }
    }

    // Smart Waiting Logic
    let checkCount = 0;
    const waitData = setInterval(() => {
        checkCount++;
        if (typeof animeList !== 'undefined' && animeList.length > 0) {
            setupPage();
            clearInterval(waitData);
        } else if (checkCount > 60) {
            clearInterval(waitData);
        }
    }, 100);
</script>

</body>
</html>
