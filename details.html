<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Anime Details | Viral Anime Hub</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff0055">
    
    <style>
        :root { --main: #ff0055; --bg: #0b0e14; --card: #1c2129; --accent: #00d4ff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; -webkit-tap-highlight-color: transparent; }
        
        header { padding: 15px 5%; background: #000; border-bottom: 2px solid var(--main); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-weight: bold; color: var(--main); font-size: 18px; text-decoration: none; text-transform: uppercase; }
        .back-btn { background: var(--main); color: white; border: none; border-radius: 50%; width: 35px; height: 35px; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: bold; font-size: 20px; }
        
        .container { padding: 20px 5%; max-width: 900px; margin: auto; }
        
        /* Hero Section */
        .hero-card { background: var(--card); border-radius: 20px; padding: 25px; border: 1px solid #333; text-align: center; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .hero-card img { width: 160px; height: 230px; border-radius: 12px; margin-bottom: 15px; object-fit: cover; border: 2px solid #444; box-shadow: 0 5px 15px rgba(0,0,0,0.8); }
        .hero-card h1 { font-size: 24px; color: var(--main); margin-bottom: 10px; line-height: 1.2; }
        
        .meta-info { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .badge { background: rgba(255,0,85,0.15); border: 1px solid var(--main); padding: 4px 12px; border-radius: 15px; font-size: 12px; color: var(--main); font-weight: bold; }

        .desc { font-size: 14px; line-height: 1.6; color: #ccc; background: rgba(255,255,255,0.03); padding: 15px; border-radius: 10px; text-align: left; border-left: 3px solid var(--main); margin-top: 10px; }

        /* 🔥 SCROLLABLE SEASON TABS */
        .tabs-container { position: sticky; top: 65px; background: var(--bg); z-index: 90; padding: 10px 0; margin: 10px 0; }
        .tabs { display: flex; gap: 10px; overflow-x: auto; white-space: nowrap; padding: 5px 0; scrollbar-width: none; /* Firefox */ -ms-overflow-style: none; /* IE/Edge */ }
        .tabs::-webkit-scrollbar { display: none; /* Chrome/Safari */ }
        
        .tab-btn { background: #1c2129; border: 1px solid #333; color: white; padding: 10px 22px; border-radius: 25px; cursor: pointer; font-size: 14px; font-weight: 600; transition: 0.3s; flex: 0 0 auto; }
        .tab-btn.active { background: var(--main); border-color: var(--main); box-shadow: 0 4px 12px rgba(255, 0, 85, 0.4); }

        /* Episode List */
        .ep-list { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        .ep-card { background: #161b22; padding: 18px 20px; border-radius: 12px; text-decoration: none; color: white; display: flex; justify-content: space-between; align-items: center; border: 1px solid #222; transition: 0.2s; }
        .ep-card:hover { border-color: var(--main); transform: translateX(5px); background: #1c2129; }
        .ep-card strong { font-size: 15px; }
        .play-icon { color: var(--main); font-size: 18px; font-weight: bold; }

        footer { margin-top: 50px; padding: 30px; text-align: center; border-top: 1px solid #333; font-size: 13px; color: #888; background: #000; }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="back-btn">←</a>
    <a href="index.html" class="logo">VIRAL ANIME</a>
    <div style="width: 35px;"></div>
</header>

<div class="container" id="loader">
    <h2 style="text-align: center; margin-top: 100px; color: var(--main);">⌛ Loading...</h2>
</div>

<div class="container" id="mainContent" style="display: none;">
    <div class="hero-card">
        <img id="poster" src="" alt="Poster">
        <h1 id="title">Anime Title</h1>
        <div class="meta-info" id="meta"></div>
        <p class="desc" id="desc"></p>
    </div>

    <div class="tabs-container">
        <div class="tabs" id="seasonTabs"></div>
    </div>
    
    <div id="episodeWrapper">
        <h3 style="margin: 10px 0 20px; border-left: 4px solid var(--main); padding-left: 15px; font-size: 18px;" id="currentSeasonName">Episodes</h3>
        <div class="ep-list" id="epList"></div>
    </div>
</div>

<footer>
    <p>&copy; 2024 - 2026 <span style="color:var(--main); font-weight:bold;">Viral Anime Hub</span></p>
    <p style="font-size: 11px; margin-top: 5px; opacity: 0.6;">High Quality Anime Streaming Links</p>
</footer>

<script src="js/main_data.js"></script>
<script src="js/list.js"></script>

<script>
    // 1. Load All Anime Files
    if (typeof myAnimes !== 'undefined' && myAnimes.length > 0) {
        myAnimes.forEach(name => {
            let s = document.createElement('script');
            s.src = `js/animes/${name}.js`;
            s.async = false; 
            document.head.appendChild(s);
        });
    }

    // 2. Season Change Logic
    function showSeason(sIdx, id) {
        const anime = animeList.find(a => a.id === id);
        const season = anime.seasons[sIdx];
        const epList = document.getElementById('epList');
        const seasonNameDisplay = document.getElementById('currentSeasonName');

        seasonNameDisplay.innerText = `${season.name} • ${season.server1.length} Episodes`;

        epList.innerHTML = season.server1.map((url, eIdx) => `
            <a href="player.html?id=${id}&s=${sIdx}&ep=${eIdx}" class="ep-card">
                <div>
                    <strong>Episode ${eIdx + 1}</strong>
                    <div style="font-size:11px; color:#888; margin-top:3px;">Server 1 • 1080p</div>
                </div>
                <span class="play-icon">▶</span>
            </a>
        `).join('');

        // Active Tab Visual
        document.querySelectorAll('.tab-btn').forEach((btn, i) => {
            btn.classList.toggle('active', i === sIdx);
        });
    }

    // 3. Page Setup
    function setupPage() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const anime = animeList.find(a => a.id === id);

        if (anime) {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';

            document.getElementById('pageTitle').innerText = anime.title + " | Viral Anime Hub";
            document.getElementById('title').innerText = anime.title;
            document.getElementById('poster').src = anime.poster;
            document.getElementById('desc').innerText = anime.description || "Description coming soon! Enjoy the episodes.";
            
            document.getElementById('meta').innerHTML = `
                <span class="badge">${anime.year || '2024'}</span>
                <span class="badge">⭐ ${anime.rating || '8.5'}</span>
                <span class="badge">Hindi/English</span>
            `;

            const tabs = document.getElementById('seasonTabs');
            if (anime.seasons && anime.seasons.length > 0) {
                tabs.innerHTML = anime.seasons.map((s, i) => `
                    <button class="tab-btn" onclick="showSeason(${i}, '${id}')">${s.name}</button>
                `).join('');
                
                showSeason(0, id);
            }
        } else {
            document.getElementById('loader').innerHTML = "<h2 style='text-align:center;'>Anime Not Found! 😢</h2><br><center><a href='index.html' style='color:var(--main)'>Back to Home</a></center>";
        }
    }

    // Smart Waiting for Data
    let checkCount = 0;
    const waitData = setInterval(() => {
        checkCount++;
        if (typeof animeList !== 'undefined' && animeList.length > 0) {
            setupPage();
            clearInterval(waitData);
        } else if (checkCount > 50) {
            document.getElementById('loader').innerHTML = "<h2 style='text-align:center;'>Timeout: Please Refresh 🔄</h2>";
            clearInterval(waitData);
        }
    }, 100);
</script>

</body>
</html>
