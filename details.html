<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Anime Details | Viral Anime Hub</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff0055">
    
    <style>
        :root { --main: #ff0055; --bg: #0b0e14; --card: #1c2129; --accent: #00d4ff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; }
        
        header { padding: 15px 5%; background: #000; border-bottom: 2px solid var(--main); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-weight: bold; color: var(--main); font-size: 18px; text-decoration: none; }
        .back-btn { background: var(--main); color: white; border: none; border-radius: 50%; width: 35px; height: 35px; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: bold; }
        
        .container { padding: 20px 5%; max-width: 900px; margin: auto; }
        
        /* Hero Card Section */
        .hero-card { background: var(--card); border-radius: 20px; padding: 25px; border: 1px solid #333; text-align: center; margin-bottom: 25px; }
        .hero-card img { width: 160px; height: 230px; border-radius: 12px; margin-bottom: 15px; object-fit: cover; border: 2px solid #444; }
        .hero-card h1 { font-size: 24px; color: var(--main); margin-bottom: 10px; }
        
        .meta-info { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .badge { background: rgba(255,0,85,0.15); border: 1px solid var(--main); padding: 4px 12px; border-radius: 15px; font-size: 12px; color: var(--main); }

        .desc { font-size: 14px; line-height: 1.6; color: #ccc; background: #161b22; padding: 15px; border-radius: 10px; text-align: left; border-left: 3px solid var(--main); }

        /* Season Tabs */
        .tabs { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; margin: 20px 0; scrollbar-width: none; }
        .tab-btn { background: #222; border: 1px solid #444; color: white; padding: 8px 20px; border-radius: 20px; cursor: pointer; white-space: nowrap; }
        .tab-btn.active { background: var(--main); border-color: var(--main); }

        /* Episode List */
        .ep-list { display: flex; flex-direction: column; gap: 10px; }
        .ep-card { background: #161b22; padding: 15px 20px; border-radius: 10px; text-decoration: none; color: white; display: flex; justify-content: space-between; align-items: center; border: 1px solid #222; transition: 0.2s; }
        .ep-card:hover { border-color: var(--main); transform: translateX(5px); background: #1c2129; }
        .play-icon { color: var(--main); font-size: 18px; }

        footer { margin-top: 50px; padding: 30px; text-align: center; border-top: 1px solid #333; font-size: 13px; color: #888; }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="back-btn">←</a>
    <a href="index.html" class="logo">VIRAL ANIME</a>
    <div style="width: 35px;"></div> </header>

<div class="container" id="loader">
    <h2 style="text-align: center; margin-top: 50px;">Loading Details...</h2>
</div>

<div class="container" id="mainContent" style="display: none;">
    <div class="hero-card">
        <img id="poster" src="" alt="Poster">
        <h1 id="title">Anime Title</h1>
        <div class="meta-info" id="meta">
            </div>
        <p class="desc" id="desc">Description load ho rahi hai...</p>
    </div>

    <div class="tabs" id="seasonTabs"></div>
    
    <div id="episodeWrapper">
        <h3 style="margin-bottom: 15px; border-left: 3px solid var(--main); padding-left: 10px;" id="currentSeasonName">Episodes</h3>
        <div class="ep-list" id="epList"></div>
    </div>
</div>

<footer>
    <p>&copy; 2024 - 2026 <span style="color:var(--main)">Viral Anime Hub</span></p>
</footer>

<script src="js/main_data.js"></script>
<script src="js/list.js"></script>

<script>
    // 1. Load All Anime Files
    if (typeof myAnimes !== 'undefined' && myAnimes.length > 0) {
        myAnimes.forEach(name => {
            let s = document.createElement('script');
            s.src = `js/animes/${name}.js`;
            s.async = false; 
            document.head.appendChild(s);
        });
    }

    function showSeason(sIdx, id) {
        const anime = animeList.find(a => a.id === id);
        const season = anime.seasons[sIdx];
        const epList = document.getElementById('epList');
        const seasonNameDisplay = document.getElementById('currentSeasonName');

        // Update Season Name
        seasonNameDisplay.innerText = `${season.name} (${season.server1.length} Episodes)`;

        // Render Episodes
        epList.innerHTML = season.server1.map((url, eIdx) => `
            <a href="player.html?id=${id}&s=${sIdx}&ep=${eIdx}" class="ep-card">
                <span><strong>Episode ${eIdx + 1}</strong> - HD Quality</span>
                <span class="play-icon">▶</span>
            </a>
        `).join('');

        // Active Tab Style
        document.querySelectorAll('.tab-btn').forEach((btn, i) => {
            btn.classList.toggle('active', i === sIdx);
        });
    }

    function setupPage() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const anime = animeList.find(a => a.id === id);

        if (anime) {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';

            // Fill Details (Safe checks ke saath)
            document.getElementById('pageTitle').innerText = anime.title;
            document.getElementById('title').innerText = anime.title;
            document.getElementById('poster').src = anime.poster;
            document.getElementById('desc').innerText = anime.description || "Is anime ki description jald hi update ki jayegi. Tab tak episodes enjoy karein!";
            
            // Meta Badges
            document.getElementById('meta').innerHTML = `
                <span class="badge">${anime.year || '2024'}</span>
                <span class="badge">⭐ ${anime.rating || '8.8'}</span>
                <span class="badge">Sub/Dub</span>
            `;

            // Season Tabs
            const tabs = document.getElementById('seasonTabs');
            if (anime.seasons && anime.seasons.length > 0) {
                tabs.innerHTML = anime.seasons.map((s, i) => `
                    <button class="tab-btn" onclick="showSeason(${i}, '${id}')">${s.name}</button>
                `).join('');
                
                // Load 1st Season by default
                showSeason(0, id);
            }
        } else {
            document.getElementById('loader').innerHTML = "<h2>Anime Not Found! 😢</h2><br><a href='index.html' style='color:var(--main)'>Go Back Home</a>";
        }
    }

    // Smart Waiting Logic
    let checkCount = 0;
    const waitData = setInterval(() => {
        checkCount++;
        if (typeof animeList !== 'undefined' && animeList.length > 0) {
            setupPage();
            clearInterval(waitData);
        } else if (checkCount > 50) {
            document.getElementById('loader').innerHTML = "<h2>Data load hone mein waqt lag raha hai... Refresh karein.</h2>";
            clearInterval(waitData);
        }
    }, 100);
</script>

</body>
</html>
