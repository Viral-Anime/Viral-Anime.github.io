<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playing Episode</title>
    <style>
        :root { --main: #ff0055; --bg: #0b0e14; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; }
        
        header { padding: 12px 5%; background: #000; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .back-to-info { text-decoration: none; color: white; background: var(--main); padding: 6px 15px; border-radius: 4px; font-size: 13px; font-weight: bold; }

        .server-bar { display: flex; gap: 5px; padding: 10px; background: #000; justify-content: center; }
        .srv { padding: 10px 20px; background: #1c2129; border: 1px solid #333; color: white; cursor: pointer; font-size: 12px; }
        .srv.active { background: #2e7d32; border-color: #4caf50; }

        .player-box { width: 100%; position: relative; padding-top: 56.25%; background: #000; }
        iframe { position: absolute; top:0; left:0; width: 100%; height: 100%; border:none; }

        .nav-controls { display: flex; justify-content: space-around; padding: 15px; background: #161b22; border-bottom: 1px solid #333; }
        .ctrl-btn { background: #222; border: 1px solid #444; color: white; padding: 10px 25px; border-radius: 5px; cursor: pointer; }
        .ctrl-btn:disabled { opacity: 0.3; }

        .mini-list-title { padding: 15px 5% 5px; font-size: 14px; color: var(--main); font-weight: bold; }
        .mini-ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px; padding: 15px 5%; }
        .mini-ep { padding: 10px; background: #1c2129; border: 1px solid #333; color: white; text-decoration: none; text-align: center; border-radius: 4px; font-size: 12px; }
        .mini-ep.active { border-color: var(--main); color: var(--main); background: #2d131a; }
    </style>
</head>
<body>

<header>
    <div id="epTitle" style="font-size: 14px;">Episode ..</div>
    <a href="#" id="backBtn" class="back-to-info">Details Page</a>
</header>

<div class="server-bar" id="serverBar"></div>

<div class="player-box">
    <iframe id="videoPlayer" src="" allowfullscreen></iframe>
</div>

<div class="nav-controls">
    <button id="pBtn" class="ctrl-btn" onclick="changeEp(-1)">PREV</button>
    <button id="nBtn" class="ctrl-btn" onclick="changeEp(1)">NEXT</button>
</div>

<div class="mini-list-title">Episodes in this Season:</div>
<div class="mini-ep-grid" id="miniGrid"></div>

<script src="data.js"></script>
<script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const sIdx = parseInt(params.get('s')) || 0;
    const epIdx = parseInt(params.get('ep')) || 0;
    const anime = animeList.find(a => a.id === id);

    // Back Button Logic
    document.getElementById('backBtn').href = `details.html?id=${id}`;

    function setupPlayer(srvType) {
        const episodeData = anime.seasons[sIdx];
        // Server selection logic
        let url = srvType === 2 ? episodeData.server2[epIdx] : episodeData.server1[epIdx];
        document.getElementById('videoPlayer').src = url;
        
        document.querySelectorAll('.srv').forEach((b, i) => b.classList.toggle('active', i === (srvType-1)));
    }

    if(anime) {
        const season = anime.seasons[sIdx];
        document.getElementById('epTitle').innerText = `${anime.title} - S${sIdx+1} E${epIdx+1}`;
        
        // 1. Dynamic Servers
        const sBar = document.getElementById('serverBar');
        if(season.server1 && season.server1.length > 0) {
            sBar.innerHTML += `<div class="srv active" onclick="setupPlayer(1)">Server 1</div>`;
        }
        if(season.server2 && season.server2.length > 0) {
            sBar.innerHTML += `<div class="srv" onclick="setupPlayer(2)">Server 2</div>`;
        }

        // 2. Navigation
        document.getElementById('pBtn').disabled = (epIdx === 0);
        document.getElementById('nBtn').disabled = (epIdx >= season.episodes.length - 1);

        // 3. Mini Episode List
        const mGrid = document.getElementById('miniGrid');
        mGrid.innerHTML = season.episodes.map((_, i) => `
            <a href="player.html?id=${id}&s=${sIdx}&ep=${i}" class="mini-ep ${i===epIdx?'active':''}">Ep ${i+1}</a>
        `).join('');

        setupPlayer(1);
    }

    function changeEp(step) {
        window.location.href = `player.html?id=${id}&s=${sIdx}&ep=${epIdx + step}`;
    }
</script>
</body>
</html>
