<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watching - Viral Anime</title>
    <script src="data.js"></script>
    <style>
        :root { --main: #ff0055; --bg: #0b0e14; --card: #1c2129; }
        body { font-family: sans-serif; background: var(--bg); color: #fff; margin: 0; padding-bottom: 20px; }
        .nav { padding: 15px; background: #000; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .nav a { color: var(--main); text-decoration: none; font-weight: bold; }
        .content { padding: 15px; max-width: 900px; margin: auto; }
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; border-radius: 8px; overflow: hidden; background: #000; border: 1px solid #333; }
        .video-wrapper iframe { position: absolute; top:0; left:0; width:100%; height:100%; border:none; }
        
        /* Server Buttons Style */
        .server-box { display: flex; gap: 10px; margin-top: 15px; }
        .srv-btn { flex: 1; background: var(--card); border: 1px solid #444; color: #fff; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .srv-btn.active { border-color: var(--main); background: rgba(255, 0, 85, 0.1); color: var(--main); }

        .controls { display: flex; justify-content: space-between; margin-top: 15px; gap: 10px; }
        .ctrl-btn { flex: 1; background: var(--main); border: none; color: #fff; padding: 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .ctrl-btn:disabled { opacity: 0.3; background: #444; }
        
        .ep-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
        .ep-btn { background: var(--card); border: 1px solid #333; color: #fff; padding: 12px 18px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .ep-btn.active { background: var(--main); border-color: var(--main); }
        
        .anime-info { margin-top: 25px; background: #161b22; padding: 15px; border-radius: 8px; border: 1px solid #333; }
        .meta { color: #ff0055; font-weight: bold; margin-bottom: 10px; font-size: 14px; }
        .desc { color: #ccc; font-size: 14px; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="nav">
        <a href="index.html">← Back</a>
        <span id="ep-indicator" style="font-size: 13px; color: #aaa;"></span>
    </div>

    <div class="content">
        <div class="video-wrapper">
            <iframe id="video" src="" allowfullscreen="true"></iframe>
        </div>

        <div class="server-box" id="serverBox">
            <button class="srv-btn active" id="btnSrv1" onclick="switchServer(1)">Server 1</button>
            <button class="srv-btn" id="btnSrv2" onclick="switchServer(2)" style="display:none;">Server 2</button>
        </div>

        <div class="controls">
            <button class="ctrl-btn" id="prevBtn" onclick="changeEp(-1)">« Previous</button>
            <button class="ctrl-btn" id="nextBtn" onclick="changeEp(1)">Next »</button>
        </div>

        <h2 id="title" style="color:var(--main); margin-top:20px; font-size: 18px;"></h2>

        <div class="anime-info">
            <div class="meta"><span id="det-year"></span> • <span id="det-runtime"></span> • ⭐ <span id="det-rating"></span></div>
            <p class="desc" id="det-desc"></p>
            <p style="font-size:13px; color:#8b949e;"><strong>Genres:</strong> <span id="det-genre" style="color:#eee"></span></p>
        </div>

        <h3 style="margin-top:25px; border-left: 3px solid var(--main); padding-left: 10px;">Episodes</h3>
        <div class="ep-list" id="btns"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const animeId = params.get('id');
        let currentIdx = 0;
        let currentServer = 1;
        let anime;

        if (typeof animeList !== 'undefined') {
            anime = animeList.find(a => a.id == animeId);
            if(anime) {
                document.title = "Watching " + anime.title;
                document.getElementById('title').innerText = anime.title;
                document.getElementById('det-year').innerText = anime.year || "2024";
                document.getElementById('det-runtime').innerText = anime.duration || "24m";
                document.getElementById('det-rating').innerText = anime.rating || "N/A";
                document.getElementById('det-desc').innerText = anime.description || "";
                document.getElementById('det-genre').innerText = anime.genres || "";

                // Show Server 2 button only if links exist
                if (anime.server2 && anime.server2.length > 0) {
                    document.getElementById('btnSrv2').style.display = "block";
                }

                function loadEp(index) {
                    currentIdx = index;
                    const links = (currentServer === 1) ? anime.server1 : anime.server2;
                    document.getElementById('video').src = links[index];
                    document.getElementById('ep-indicator').innerText = `EP ${index + 1} / ${links.length}`;
                    
                    document.querySelectorAll('.ep-btn').forEach((b, i) => b.classList.toggle('active', i === index));
                    document.getElementById('prevBtn').disabled = (index === 0);
                    document.getElementById('nextBtn').disabled = (index === links.length - 1);
                    window.scrollTo({top: 0, behavior: 'smooth'});
                }

                window.switchServer = (num) => {
                    currentServer = num;
                    document.getElementById('btnSrv1').classList.toggle('active', num === 1);
                    document.getElementById('btnSrv2').classList.toggle('active', num === 2);
                    loadEp(currentIdx);
                };

                window.changeEp = (step) => loadEp(currentIdx + step);

                anime.server1.forEach((_, i) => {
                    const b = document.createElement('div');
                    b.className = 'ep-btn';
                    b.innerText = i + 1;
                    b.onclick = () => loadEp(i);
                    document.getElementById('btns').appendChild(b);
                });

                loadEp(0);
            }
        }
    </script>
</body>
</html>
