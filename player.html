<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Viral Anime Player</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff0055">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --main: #ff0055; --bg: #0b0e14; --card: #1c2129; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; overflow-x: hidden; }
        header { padding: 12px 5%; background: #000; border-bottom: 2px solid var(--main); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        #displayTitle { font-size: 14px; font-weight: bold; color: var(--main); max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .header-right { display: flex; gap: 8px; }
        .head-btn { background: #222; color: white; border: 1px solid #444; border-radius: 8px; padding: 6px 12px; font-size: 12px; text-decoration: none; }
        .server-container { display: flex; gap: 10px; padding: 15px 5%; justify-content: center; flex-wrap: wrap; background: #0f1218; }
        .srv-btn { padding: 8px 16px; background: #1c2129; border: 1px solid #333; color: white; cursor: pointer; font-size: 12px; border-radius: 5px; }
        .srv-btn.active { background: var(--main); border-color: var(--main); }
        .video-wrapper { width: 100%; max-width: 1000px; margin: 0 auto; position: relative; padding-top: 56.25%; background: #000; }
        iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .controls-bar { display: flex; justify-content: center; gap: 15px; padding: 20px; background: #0f1218; border-bottom: 1px solid #222; }
        .nav-btn { background: #1c2129; border: 1px solid #444; color: white; cursor: pointer; padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: bold; }
        .nav-btn:disabled { opacity: 0.3; }
        .episode-section { padding: 25px 5%; max-width: 1000px; margin: auto; }
        .section-title { font-size: 15px; color: #fff; margin-bottom: 15px; border-left: 3px solid var(--main); padding-left: 10px; }
        .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 10px; }
        .ep-link { padding: 10px; background: #1c2129; border: 1px solid #333; color: white; text-decoration: none; text-align: center; border-radius: 8px; font-size: 12px; }
        .ep-link.active { background: var(--main); border-color: var(--main); }
        footer { padding: 20px; text-align: center; font-size: 12px; color: #666; }
    </style>
</head>
<body>

<header>
    <div id="displayTitle">Loading...</div>
    <div class="header-right">
        <a href="#" id="detailsBtn" class="head-btn">Back</a>
        <a href="index.html" class="head-btn"><i class="fas fa-home"></i></a>
    </div>
</header>

<div class="server-container" id="srvBox"></div>

<div class="video-wrapper">
    <iframe id="playerFrame" src="" allowfullscreen></iframe>
</div>

<div class="controls-bar">
    <button id="prevBtn" class="nav-btn" onclick="goEp(-1)">Prev</button>
    <button id="nextBtn" class="nav-btn" onclick="goEp(1)">Next</button>
</div>

<div class="episode-section">
    <div class="section-title">Episodes</div>
    <div class="ep-grid" id="miniGrid"></div>
</div>

<footer>&copy; 2026 Viral Anime Hub</footer>

<script src="js/main_data.js"></script>
<script src="js/list.js"></script>

<script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const sIdx = parseInt(params.get('s')) || 0;
    const epIdx = parseInt(params.get('ep')) || 0;

    // 1. Sabhi Anime Files ko Force Load karna
    if (typeof myAnimes !== 'undefined') {
        myAnimes.forEach(name => {
            let s = document.createElement('script');
            s.src = `js/animes/${name}.js`;
            s.async = false;
            document.head.appendChild(s);
        });
    }

    function loadSource(srvNum, anime) {
        const season = anime.seasons[sIdx];
        const videoUrl = (srvNum === 2 && season.server2 && season.server2[epIdx]) 
                         ? season.server2[epIdx] 
                         : season.server1[epIdx];
        
        if(videoUrl) {
            document.getElementById('playerFrame').src = videoUrl;
            document.querySelectorAll('.srv-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === (srvNum - 1));
            });
        }
    }

    function renderPlayer() {
        if (typeof animeList === 'undefined') return;
        const anime = animeList.find(a => a.id === id);

        if (anime && anime.seasons[sIdx]) {
            const season = anime.seasons[sIdx];
            
            // UI Updates
            document.getElementById('displayTitle').innerText = `${anime.title} - S${sIdx+1} E${epIdx+1}`;
            document.title = "Watching " + anime.title;
            document.getElementById('detailsBtn').href = `details.html?id=${id}`;

            // Server Buttons
            const srvBox = document.getElementById('srvBox');
            srvBox.innerHTML = `<button class="srv-btn active" onclick="loadSource(1, ${JSON.stringify(anime).replace(/"/g, '&quot;')})">Server 1</button>`;
            if (season.server2 && season.server2.length > 0) {
                srvBox.innerHTML += `<button class="srv-btn" onclick="loadSource(2, ${JSON.stringify(anime).replace(/"/g, '&quot;')})">Server 2</button>`;
            }

            // Prev/Next Logic
            document.getElementById('prevBtn').disabled = (epIdx === 0);
            document.getElementById('nextBtn').disabled = (epIdx >= season.server1.length - 1);

            // Mini Grid
            const miniGrid = document.getElementById('miniGrid');
            miniGrid.innerHTML = season.server1.map((_, i) => `
                <a href="player.html?id=${id}&s=${sIdx}&ep=${i}" class="ep-link ${i === epIdx ? 'active' : ''}">${i+1}</a>
            `).join('');

            // Load Video
            loadSource(1, anime);
        }
    }

    // Data Load Hone Ka Wait
    setTimeout(() => {
        if (typeof animeList !== 'undefined') {
            renderPlayer();
        } else {
            // Re-try after a bit
            setTimeout(renderPlayer, 1000);
        }
    }, 500);

    function goEp(step) {
        window.location.href = `player.html?id=${id}&s=${sIdx}&ep=${epIdx + step}`;
    }
</script>

</body>
</html>
