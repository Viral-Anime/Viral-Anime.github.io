<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viral Anime | Player</title>
    <style>
        :root { --main: #ff0055; --bg: #0b0e14; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; text-align: center; }
        header { padding: 15px; background: #000; border-bottom: 2px solid var(--main); margin-bottom: 20px; }
        .logo { color: var(--main); font-weight: bold; text-decoration: none; font-size: 20px; }
        .player-box { width: 95%; max-width: 900px; margin: auto; }
        iframe { width: 100%; height: 450px; border: 2px solid #333; border-radius: 10px; background: #000; }
        .controls { margin-top: 20px; display: flex; justify-content: center; gap: 10px; }
        button { padding: 12px 20px; cursor: pointer; background: var(--main); border: none; color: white; font-weight: bold; border-radius: 5px; }
        button:disabled { background: #333; cursor: not-allowed; opacity: 0.5; }
        .details { text-align: left; padding: 20px; max-width: 900px; margin: auto; }
        h2 { color: var(--main); margin: 10px 0; }
        p { color: #bbb; line-height: 1.6; }
        @media (max-width: 600px) { iframe { height: 250px; } }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">VIRAL ANIME</a>
    </header>

    <div class="player-box">
        <h2 id="displayTitle">Loading...</h2>
        <p id="displayEp" style="color:var(--main); font-weight:bold;">Episode --</p>
        
        <iframe id="videoPlayer" src="" allowfullscreen="true" scrolling="no"></iframe>

        <div class="controls">
            <button id="prevBtn" onclick="changeEp(-1)">Previous</button>
            <button id="nextBtn" onclick="changeEp(1)">Next Episode</button>
        </div>
    </div>

    <div class="details">
        <h3>Description:</h3>
        <p id="displayDesc">Anime details loading...</p>
    </div>

    <script src="data.js"></script>

    <script>
        const params = new URLSearchParams(window.location.search);
        const animeId = params.get('id');
        let currentEp = parseInt(params.get('ep')) || 0;

        function loadPlayer() {
            // data.js se anime dhundo
            const anime = animeList.find(a => a.id === animeId);

            if (anime) {
                // UI Update Karo
                document.getElementById('displayTitle').innerText = anime.title;
                document.getElementById('displayEp').innerText = "Episode " + (currentEp + 1);
                document.getElementById('displayDesc').innerText = anime.description;

                // Video Source Update (Ye Main Hai)
                const videoUrl = anime.server1[currentEp];
                document.getElementById('videoPlayer').src = videoUrl;

                // Buttons check karo
                document.getElementById('prevBtn').disabled = (currentEp === 0);
                document.getElementById('nextBtn').disabled = (currentEp >= anime.server1.length - 1);
            } else {
                document.body.innerHTML = "<h1>Anime Not Found</h1><a href='index.html' style='color:white'>Go Back</a>";
            }
        }

        function changeEp(step) {
            currentEp += step;
            // Naya URL banao aur page refresh kar do
            // Isse Solo Leveling ke hashtag wala issue khatam ho jayega
            const newUrl = `player.html?id=${animeId}&ep=${currentEp}`;
            window.location.href = newUrl;
        }

        // Run on Load
        window.onload = loadPlayer;
    </script>

</body>
</html>
