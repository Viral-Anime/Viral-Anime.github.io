<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viral Player</title>
    <style>
        :root { --main: #ff0055; --bg: #0b0e14; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; }
        
        .alert-top { background: #ff0000; color: white; padding: 8px; font-size: 11px; text-align: center; font-weight: bold; }

        /* Server Grid: Dynamic */
        .server-grid { display: flex; gap: 2px; background: #000; padding: 5px; justify-content: center; }
        .srv-btn { flex: 1; max-width: 120px; padding: 12px 5px; background: #1c2129; border: 1px solid #333; color: white; font-size: 12px; cursor: pointer; }
        .srv-btn.active { background: #4caf50; border: none; font-weight: bold; }

        .video-box { width: 100%; position: relative; padding-top: 56.25%; background: #000; }
        iframe { position: absolute; top:0; left:0; width: 100%; height: 100%; border:none; }

        /* Navigation Bar */
        .nav-controls { display: grid; grid-template-columns: repeat(4, 1fr); background: #161b22; border-top: 1px solid #333; }
        .nav-item { padding: 15px 5px; border: none; background: none; color: white; text-align: center; cursor: pointer; text-decoration: none; }
        .nav-item i { display: block; font-size: 18px; margin-bottom: 5px; }
        .nav-item span { font-size: 10px; text-transform: uppercase; opacity: 0.8; }

        /* Bottom Episode List */
        .bottom-list { padding: 20px; }
        .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px; margin-top: 15px; }
        .ep-box { padding: 10px; background: #1c2129; border: 1px solid #333; color: white; text-decoration: none; text-align: center; border-radius: 4px; font-size: 12px; }
        .ep-box.active { border-color: var(--main); color: var(--main); background: #2d131a; }
    </style>
</head>
<body>

<div class="alert-top">Player Not Showing/Lag - Use Cloudflare 1.1.1.1 App</div>

<div class="server-grid" id="serverGrid">
    </div>

<div class="video-box">
    <iframe id="videoPlayer" src="" allowfullscreen></iframe>
</div>

<div class="nav-controls">
    <a href="javascript:history.back()" class="nav-item">⬅️<span>Back</span></a>
    <button class="nav-item" onclick="changeEp(-1)">⏪<span>Prev</span></button>
    <a href="#" id="listLink" class="nav-item">☰<span>List</span></a>
    <button class="nav-item" onclick="changeEp(1)">⏩<span>Next</span></button>
</div>

<div class="bottom-list">
    <h3 style="font-size: 16px; border-left: 3px solid var(--main); padding-left: 10px;">Episodes</h3>
    <div class="ep-grid" id="bottomEpGrid"></div>
</div>

<script src="data.js"></script>
<script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    let currentEp = parseInt(params.get('ep')) || 0;
    const anime = animeList.find(a => a.id === id);

    function initPlayer(serverNum) {
        if(!anime) return;
        
        // Server data check
        const serverData = serverNum === 1 ? anime.server1 : anime.server2;
        document.getElementById('videoPlayer').src = serverData[currentEp];
        
        // Active button toggle
        document.querySelectorAll('.srv-btn').forEach((b, i) => {
            b.classList.toggle('active', i === (serverNum - 1));
        });
    }

    if(anime) {
        // 1. Dynamic Server Buttons
        const sGrid = document.getElementById('serverGrid');
        let serverHTML = `<button class="srv-btn active" onclick="initPlayer(1)">Server 1</button>`;
        if(anime.server2 && anime.server2.length > 0) {
            serverHTML += `<button class="srv-btn" onclick="initPlayer(2)">Server 2</button>`;
        }
        sGrid.innerHTML = serverHTML;

        // 2. Initial Load
        initPlayer(1);
        document.getElementById('listLink').href = `details.html?id=${id}`;

        // 3. Bottom Episode Grid
        const bGrid = document.getElementById('bottomEpGrid');
        bGrid.innerHTML = anime.server1.map((url, i) => `
            <a href="player.html?id=${id}&ep=${i}" class="ep-box ${i === currentEp ? 'active' : ''}">
                Ep ${i+1}
            </a>
        `).join('');
    }

    function changeEp(step) {
        let target = currentEp + step;
        if(target >= 0 && target < anime.server1.length) {
            window.location.href = `player.html?id=${id}&ep=${target}`;
        }
    }
</script>
</body>
</html>
