<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playing Anime | Viral Anime</title>
    <style>
        :root { --main: #ff0055; --bg: #0b0e14; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; text-align: center; }
        .player-container { width: 100%; max-width: 900px; margin: auto; padding: 10px; }
        iframe { width: 100%; height: 500px; border: 2px solid #333; border-radius: 10px; background: #000; }
        .controls { margin-top: 20px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        button { padding: 12px 25px; cursor: pointer; background: var(--main); border: none; color: white; font-weight: bold; border-radius: 5px; transition: 0.3s; }
        button:disabled { background: #444; cursor: not-allowed; }
        button:hover:not(:disabled) { transform: scale(1.05); background: #cc0044; }
        .info { padding: 20px; text-align: left; max-width: 900px; margin: auto; }
        h2 { color: var(--main); margin-bottom: 5px; }
        @media (max-width: 600px) { iframe { height: 250px; } }
    </style>
</head>
<body>

    <div class="player-container">
        <h2 id="animeTitle">Loading...</h2>
        <p id="episodeDisplay" style="opacity: 0.7; margin-bottom: 15px;">Episode 1</p>
        
        <iframe id="videoPlayer" src="" allowfullscreen="true" scrolling="no"></iframe>

        <div class="controls">
            <button id="prevBtn" onclick="changeEpisode(-1)">Previous</button>
            <button id="nextBtn" onclick="changeEpisode(1)">Next Episode</button>
        </div>
    </div>

    <div class="info">
        <h3 id="descTitle">Description</h3>
        <p id="description" style="color: #ccc; line-height: 1.6;"></p>
    </div>

    <script src="data.js"></script>

    <script>
        let currentAnime = null;
        let currentEp = 0;

        function initPlayer() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            currentEp = parseInt(params.get('ep')) || 0;

            currentAnime = animeList.find(a => a.id === id);

            if (currentAnime) {
                updateUI();
            } else {
                document.body.innerHTML = "<h2>Anime Not Found!</h2><a href='index.html' style='color:white;'>Go Back</a>";
            }
        }

        function updateUI() {
            // Title aur Episode text badlo
            document.getElementById('animeTitle').innerText = currentAnime.title;
            document.getElementById('episodeDisplay').innerText = `Now Playing: Episode ${currentEp + 1}`;
            document.getElementById('description').innerText = currentAnime.description;

            // Iframe source update karo (Ye sabse zaruri hai)
            const videoUrl = currentAnime.server1[currentEp];
            const player = document.getElementById('videoPlayer');
            
            // Check agar URL sach mein badal raha hai
            if (player.src !== videoUrl) {
                player.src = videoUrl;
            }

            // Buttons Enable/Disable karo
            document.getElementById('prevBtn').disabled = (currentEp === 0);
            document.getElementById('nextBtn').disabled = (currentEp === currentAnime.server1.length - 1);
        }

        function changeEpisode(direction) {
            currentEp += direction;

            // URL ko update karo bina page refresh kiye
            const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + `?id=${currentAnime.id}&ep=${currentEp}`;
            window.history.pushState({path: newUrl}, '', newUrl);

            // Naya video load karo
            updateUI();
            
            // Page ke upar scroll karein
            window.scrollTo(0, 0);
        }

        // Jab user browser ka 'Back' button dabaye
        window.onpopstate = function() {
            initPlayer();
        };

        window.onload = initPlayer;
    </script>

</body>
</html>
