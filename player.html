<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player</title>
    <style>
        :root { --main: #ff0055; --bg: #0b0e14; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; text-align: center; }
        
        /* Server Buttons */
        .server-box { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; padding: 10px; background: #000; }
        .srv-btn { padding: 10px; background: #1c2129; border: 1px solid #333; color: white; cursor: pointer; font-size: 13px; }
        .srv-btn.active { background: linear-gradient(to bottom, #4caf50, #2e7d32); border: none; font-weight: bold; }

        /* Video Container */
        .video-container { width: 100%; position: relative; padding-top: 56.25%; background: #000; }
        iframe { position: absolute; top:0; left:0; width: 100%; height: 100%; border:none; }

        /* Nav Buttons */
        .nav-bar { display: flex; justify-content: space-around; padding: 15px; background: #161b22; }
        .nav-item { background: none; border: none; color: white; cursor: pointer; display: flex; flex-direction: column; align-items: center; font-size: 20px; }
        .nav-item span { font-size: 10px; margin-top: 5px; text-transform: uppercase; }

        /* Alert Box */
        .alert { background: #b71c1c; padding: 10px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

<div class="alert">Player Not Showing/Lag - Use Cloudflare 1.1.1.1 App</div>

<div class="server-box">
    <button class="srv-btn active">VidStream</button>
    <button class="srv-btn">MyCloud</button>
    <button class="srv-btn">HydraX</button>
    <button class="srv-btn">Vidmoly</button>
</div>

<div class="video-container">
    <iframe id="mainPlayer" src="" allowfullscreen></iframe>
</div>

<div class="nav-bar">
    <button class="nav-item" onclick="history.back()">⬅️ <span>Back</span></button>
    <button id="prevBtn" class="nav-item" onclick="goEp(-1)">⏪ <span>Prev</span></button>
    <button id="listBtn" class="nav-item" onclick="goDetails()">☰ <span>List</span></button>
    <button id="nextBtn" class="nav-item" onclick="goEp(1)">⏩ <span>Next</span></button>
</div>

<script src="data.js"></script>
<script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    let currentEp = parseInt(params.get('ep')) || 0;
    const anime = animeList.find(a => a.id === id);

    function loadVideo() {
        if(!anime) return;
        document.getElementById('mainPlayer').src = anime.server1[currentEp];
        document.getElementById('prevBtn').style.opacity = (currentEp === 0) ? "0.3" : "1";
        document.getElementById('nextBtn').style.opacity = (currentEp >= anime.server1.length - 1) ? "0.3" : "1";
    }

    function goEp(step) {
        let next = currentEp + step;
        if(next >= 0 && next < anime.server1.length) {
            window.location.href = `player.html?id=${id}&ep=${next}`;
        }
    }

    function goDetails() {
        window.location.href = `details.html?id=${id}`;
    }

    window.onload = loadVideo;
</script>
</body>
</html>
